<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>QuizRush Coin App</title>
  <script src="https://telegram.org"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding-top: 50px;
      background: #1c1c1d;
      color: #ffffff;
      user-select: none;
      margin: 0;
    }
    h2 { color: #aaaaaa; font-size: 18px; }
    h1 { font-size: 36px; margin: 20px 0 40px; }
    #tap-btn {
      width: 160px;
      height: 160px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 50%;
      border: 6px solid #e67e22;
      background: radial-gradient(circle, #f1c40f, #f39c12);
      color: #1c1c1d;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(243, 156, 18, 0.4);
      transition: transform 0.08s;
    }
    #tap-btn:active {
      transform: scale(0.93);
    }
    #status {
      color: #ff6b6b;
      font-size: 14px;
      margin-top: 25px;
      padding: 0 20px;
    }
  </style>
</head>
<body>
  <h2 id="user-name">Loading...</h2>
  <h1>Coins: <span id="coin-count">0</span></h1>
  <button id="tap-btn">TAP +1</button>
  <p id="status"></p>

  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://gstatic.com";

    const statusEl = document.getElementById("status");

    const firebaseConfig = {
      apiKey: "AIzaSyCim4XYvTM2BVjJL-kNr9pA64EI1_h7eKU",
      authDomain: "quizrush-77af2.firebaseapp.com",
      projectId: "quizrush-77af2",
      storageBucket: "quizrush-77af2.firebasestorage.app",
      messagingSenderId: "969926311396",
      appId: "1:969926311396:web:d9d14e08143e007b41dbf1",
      measurementId: "G-WMEXJMYW54"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();

      const user = tg.initDataUnsafe?.user;
      const userId = user ? user.id.toString() : "test_user_123";
      document.getElementById("user-name").innerText = user ? `Welcome, ${user.first_name}` : "Test User";

      const userRef = doc(db, "users", userId);
      let currentCoins = 0;

      async function loadCoins() {
        try {
          const docSnap = await getDoc(userRef);
          if (docSnap.exists()) {
            currentCoins = docSnap.data().coins || 0;
          } else {
            await setDoc(userRef, {
              coins: 0,
              username: user?.username || "",
              firstName: user?.first_name || "Guest"
            });
          }
          document.getElementById("coin-count").innerText = currentCoins;
        } catch (err) {
          statusEl.innerText = "Database Error: " + err.message;
        }
      }

      loadCoins();

      document.getElementById("tap-btn").addEventListener("click", async () => {
        currentCoins += 1;
        document.getElementById("coin-count").innerText = currentCoins;

        if (tg.HapticFeedback) {
          tg.HapticFeedback.impactOccurred("light");
        }

        try {
          await updateDoc(userRef, { coins: increment(1) });
        } catch (err) {
          statusEl.innerText = "Save Error: " + err.message;
        }
      });

    } catch (e) {
      statusEl.innerText = "Setup Error: " + e.message;
    }
  </script>
</body>
</html>
