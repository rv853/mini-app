<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Coin Mini App</title>
  <script src="https://telegram.org"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #1c1c1d; color: white; user-select: none; }
    button { padding: 30px 45px; font-size: 22px; border-radius: 50%; border: none; background: #f39c12; color: white; cursor: pointer; }
    button:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <h2 id="user-name">Loading...</h2>
  <h1>Coins: <span id="coin-count">0</span></h1>
  <button id="tap-btn">TAP +1</button>

  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://gstatic.com";

    // Paste your exact firebaseConfig object from Firebase Console here
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_://firebaseapp.com",
      projectId: "YOUR_PROJECT_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const tg = window.Telegram.WebApp;
    tg.expand();
    const user = tg.initDataUnsafe?.user;
    const userId = user ? user.id.toString() : "test_user_123";
    document.getElementById("user-name").innerText = user ? `Welcome, ${user.first_name}` : "Test User";

    const userRef = doc(db, "users", userId);
    let currentCoins = 0;

    async function loadCoins() {
      const docSnap = await getDoc(userRef);
      if (docSnap.exists()) {
        currentCoins = docSnap.data().coins || 0;
      } else {
        await setDoc(userRef, { coins: 0, username: user?.username || "" });
      }
      document.getElementById("coin-count").innerText = currentCoins;
    }
    loadCoins();

    document.getElementById("tap-btn").addEventListener("click", async () => {
      currentCoins += 1;
      document.getElementById("coin-count").innerText = currentCoins;
      await updateDoc(userRef, { coins: increment(1) });
    });
  </script>
</body>
</html>
